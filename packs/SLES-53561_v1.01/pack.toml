# pack.toml - one game version for PS2RC. Copy games/_template/ to games/<SERIAL>_v<VERSION>/ and fill it in.
# Format 1. Path values: "{work}/x" = the work dir (local.toml [paths] work: everything derived from the game),
# "{disc}/x" = this pack's extracted disc (local.toml [games."<pack>"] disc), "{repo}/x" = the checkout,
# a plain relative path = inside this pack. Check a value with: python3 ps2rc/pack.py get <pack> <key>
format = 1

[id]
serial = "SLES-53561"                      # SYSTEM.CNF BOOT2 program name as a serial
version = "1.01"                           # SYSTEM.CNF VER
region = "PAL"
boot_elf = "SLES_535.61"                   # the boot program's file name in the disc's root
psp_title = "PS2RC SLES-53561"              # the PSP menu title; the build appends " (build N)"

[verify]
system_cnf_boot2 = 'cdrom0:\SLES_535.61;1' # what identifies the disc
elf_size = 5135320
elf_sha256 = "a2afb3dd64044174f46bdc37e0e6e7209a17d9100a9437b7974e31141106f7f4"
# data_fnv64 = "0123456789ABCDEF"          # optional: FNV-1a 64 of guest [code end, bss end) after the PSP loads the
                                           # data (a string: TOML integers are signed 64-bit)

[memory]
code = [0x00100000, 0x0053F300]            # the translated code [start, end): never read as data, not loaded on the
                                           # PSP (its host memory holds the runtime's buffers)
ctor_code = [0x005CB300, 0x005D35A8]       # static-constructor code after .data (179 constructors)
data_end = 0x005E5480                      # end of the program's file data (one PT_LOAD segment from code start)
bss_end = 0x0076A080                       # end of BSS (incl. an overlay window)
ram_end_psp = 0x01FF0000                   # guest RAM on the PSP: 32 MB - 64 KB (the runtime's cap); the world stream heap needs its 13.4 MB pool (28 MB overflowed it)

[overlays]                                 # code overlays (Metrowerks MWo3 images loaded into a window)
scheme = "mwo3"
window = [0x00757500, 0x0076A080]
files = ["OLF/CLMR.OLF", "OLF/DBLL.OLF", "OLF/JPEG.OLF", "OLF/MGAG.OLF", "OLF/MGAR.OLF", "OLF/MGBA.OLF", "OLF/MGCH.OLF",
         "OLF/MGDA.OLF", "OLF/MGDU.OLF", "OLF/MGEN.OLF", "OLF/MGKU.OLF", "OLF/MGLM.OLF", "OLF/MGRA.OLF", "OLF/MGSO.OLF",
         "OLF/MGST.OLF", "OLF/MPEG.OLF", "OLF/TRAC.OLF"]

[runtime]                                  # values the core HLE reads (the build writes them into hle_pack.h)
main_loop = ""                             # a TRACE label of hooks.def: its calls are the main-loop iterations
                                           # (--mainloop-limit, the PSP's result=main_loop)
# selftest_at = ""                         # a TRACE label: the host --selftest runs at its entry (pack's
                                           # hle_selftest_run)
wait_loops = [0x001F3EF4]                  # the game's 30 fps frame limiter (fn_001f3710: waits for 2 VBlanks): time jumps to the next event
cfg = "ps2rc.cfg"                          # the PSP run options file next to the EBOOT
# cfg_legacy = "old.cfg"                  # an older name of it: read only when cfg is not there (folders made by
                                           # an earlier version); a converter update moves its values into cfg
psp_module = "PS2RC"                       # the PSP module name
# zones = [["name", "zone.name", 0, 1]]    # extra profiler zones of the pack's modules (id, display name, flags, rate)
# boot_arg0 = 'cdrom0:\SLUS_000.00;1'      # argv[0] the kernel passes to main (default from boot_elf)

[symbols]                                  # guest data addresses the core touches (named, see hle/core/hle_sce.c)
initsys_table = 0x005EFFC8                 # libkernl: 512 bytes the _InitSys tail clears
initsys_words = 0x0056EE20                 # libkernl: 2 words the _InitSys tail clears

[translate]                                # ps2rc/pipeline/translate.py
variant = "v5s4y3rxm"                      # ABI mode (as the reference pack); v0 = exact everywhere (first boots)
unit = "main"                              # base name of the generated units
functions = "{work}/functions.pkl"       # a function set saved once (omitted: discovery runs from the entry point)
non_abi = "{work}/non_abi.json"            # functions translated exact in ABI mode (convert/non_abi.py)
exempt = true
rlive = true                               # lever rlive (variant ...r): returns write back only what callers read
overlays = true
# vfloc_skip = "lists/vfloc_skip.txt"
# psp_rules = true                         # argument-liveness rules for hooked functions / syscalls (ABI variants)

[build]                                    # mk/build.sh
translation = "{work}/trans"               # the translation (translate.py's output)
hooks = "hooks.def"
pkg_out = "{work}/psp"                     # where EBOOT.PBP goes
y_hdr = "mb,be,ca2"                        # runtime-header levers of the back-end (e.g. "mb,be" with v5s4y2)
y_gen = "-fsched-pressure"                 # extra compiler flags of the generated units (PSP)
sources = ["src", "iop", "{work}/iopgen", "{work}/vu1aot"]   # the pack's C modules (each dir may have host/ and psp/ subdirs)
# audio_sources = []                       # compiled with AUDIO=1 only (a sound-driver model)
defines = ["HLE_IOP_SND"]                  # the translated IOP sound modules (convert/iopgen.py)
# psp_ldflags = []                         # extra PSP link flags (e.g. -Wl,--wrap=...)
# zones = "zones.def"                      # profiler zones on guest functions
textpatch = "textpatch.tsv"                # heap set-up patch (see the file)
trapset = "{work}/trapset.txt"             # functions whose accesses may reach hardware registers (convert/trapset.py)
# callflush = ["fn_00000000:25"]           # register flushes before calls that read a register as a hidden argument
# natives = "lists/natives.txt"            # native C fast paths of the pack (y_nat_<addr>)
# layout = "layout"                        # code layout: cold.txt, order.ld
# patch_dir = "{work}/patch"               # extra generated units

[run]                                      # mk/run_host.sh
discmap = "{work}/discmap.txt"             # "lsn size ISO_PATH relative/path" per disc file
out = "{work}/runs"
# disc_override = ["FILE.INI={work}/file.ini"]   # serve a disc file from elsewhere (same size)

[stage]                                    # ps2rc/pipeline/stage.py and the PC converter (ps2rc/convert)
# (the PSP folder: the converter names it PS2RC_<serial>, in the window and on the command line alike)
# include = ["DATA/*"]                     # disc paths staged (case-insensitive globs) ...
# exclude = ["DATA/*.BAK"]                 # ... minus these ...
files = []                                 # ... plus these disc files (paths in the disc folder)
# audio_all = ["SOUND/*"]                  # added with --audio all / min (a game with a sound-driver model)
# audio_min = ["SOUND/BOOT.BNK"]
# replace = [{ file = "SETTINGS.INI", find = "heap 30000", with = "heap 20000" }]   # same-size text replacements
# movies = ["MOVIES/INTRO.PSS"]            # movies the converter converts (ps2rc/movies)

# per-object draw distances x0.75 (only those under 200: the far LOD models keep theirs); same file size.
# Measured at the school gate in PPSSPP: ~115 -> ~81 ms/frame with the rest of the port (convert/ide_scale.py)
[[stage.transform]]
file = "OBJECTS/IDE.IMG"
module = "convert/ide_scale.py"
function = "scale"
args = { factor = 0.75, below = 200.0, dir = "OBJECTS/IDE.DIR" }

# [stage.cfg]                              # run options written into [runtime] cfg (then --cfg key=value)
# max_seconds = "36000"

# [convert]                                # the PC converter's steps (ps2rc/convert/recipe.py); without it a pack
                                           # with [translate] gets the generic translation step only
# analysis = [["{pack}/tools/discover.py"]]          # commands run before the translation ({pack} {work} {repo}
# analysis_outputs = ["{work}/functions.pkl"]        # {disc} {analysis} {translation})
# translate = ["{repo}/ps2rc/pipeline/translate.py", "--pack", "{pack}", "--out", "{translation}"]
# extras = []                                        # commands after it (e.g. a trap set), extras_outputs = [...]
# analysis_files = ["analysis/sce_matches.json"]     # files of this pack the commands read (copied to {analysis})
# generators = []                                    # game-derived modules generated on the user's PC

# [convert.build]
# audio_model = false                      # the pack's audio_sources compiled in (AUDIO=1)

# [disc]
# layout = "analysis/iso_layout.txt"       # a disc FOLDER has no sector numbers: the layout made once from an image

# [xmb.music]                              # menu music from the player's disc (ps2rc/xmb/disc_scan.py): indexed tracks
                                           # of interleaved PS-ADPCM sub-streams (pictures need no facts: every
                                           # texture dictionary on the disc is found by its content)
# names = "SOUND/NAMES.DAT"                # container names: records of names_record bytes, the name in names_len
# names_record = 16
# names_len = 12
# index = "SOUND/TRACKS.DAT"               # one record per track (struct format): container number, offset, ...
# index_record = "<B3xII"
# container = "SOUND/{name}.STR"           # {name}: a name from the names table
# header = 0x1000                          # track header size (the audio data follows it)
# streams = 0xF00                          # sub-stream table in the header: {u32 bytes, u32 rate} each
# streams_max = 8
# stream_count = 0xF40                     # u16: sub-streams in use
# period = 0x10000                         # the sub-streams' data alternate in periods of this many bytes; each
# period_rate = 48000                      # sub-stream's share of a period = rate * period / period_rate bytes
# default_category = "other"               # radio, cutscene, beats, ambience, adverts or other
